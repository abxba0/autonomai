apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomai-api
  namespace: autonomai
spec:
  replicas: 3  # Horizontal scaling - adjust as needed
  selector:
    matchLabels:
      app: autonomai-api
  template:
    metadata:
      labels:
        app: autonomai-api
    spec:
      containers:
      - name: api
        image: autonomai:latest  # Replace with your image
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: autonomai-config
              key: REDIS_URL
        - name: REDIS_STATE_URL
          valueFrom:
            configMapKeyRef:
              name: autonomai-config
              key: REDIS_STATE_URL
        - name: ENABLE_DISTRIBUTED_STATE
          valueFrom:
            configMapKeyRef:
              name: autonomai-config
              key: ENABLE_DISTRIBUTED_STATE
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: autonomai-secrets
              key: SECRET_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: autonomai-secrets
              key: ANTHROPIC_API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: autonomai-secrets
              key: OPENAI_API_KEY
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: autonomai-secrets
              key: GOOGLE_API_KEY
        command:
        - uvicorn
        - web.api_secure:app
        - --host
        - "0.0.0.0"
        - --port
        - "8000"
        - --workers
        - "2"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: autonomai-api
  namespace: autonomai
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: autonomai-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autonomai-api-hpa
  namespace: autonomai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autonomai-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
